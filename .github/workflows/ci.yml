name: Build checks

on:
  push:
    branches:
      - main
      - alumni-platform
      - integration/desktop
      - "feat/**"
  pull_request:
    branches:
      - main
      - integration/desktop

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alumniconnect
      JWT_SECRET: github-actions-test-secret
      CLIENT_ORIGIN: http://localhost:5173
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alumniconnect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alumniconnect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install desktop dependencies
        run: npm install

      - name: Install API dependencies
        run: npm --prefix server install

      - name: Install React dependencies
        run: npm --prefix client install

      - name: Check JavaScript syntax
        run: |
          node --check desktop/main.js
          node --check desktop/ipc/register-handlers.js
          node --check desktop/tray.js
          node --check desktop/preload.cjs
          node --check server/src/index.js
          node --check server/src/auth.js
          node --check server/src/setup.js
          node --check server/src/seed.js
          node --check server/src/smoke-test.js

      - name: Create database schema
        working-directory: server
        run: npm run db:setup

      - name: Insert demo data
        working-directory: server
        run: npm run seed

      - name: Start API
        run: npm --prefix server run dev > /tmp/alumniconnect-api.log 2>&1 &

      - name: Wait for API
        run: npx wait-on tcp:4000

      - name: Test API workflows against PostgreSQL
        working-directory: server
        run: npm run test:smoke

      - name: Build React frontend
        run: npm --prefix client run build
